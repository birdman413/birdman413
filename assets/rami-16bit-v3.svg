<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Rami 16-bit player screen</title>
  <desc id="desc">A dark pixel-art developer screen featuring an original player character, a terminal, data nodes, health, experience, and a text-only Taiwan slogan panel.</desc>

  <rect width="960" height="360" fill="#090d1a"/>
  <rect x="8" y="8" width="944" height="344" fill="none" stroke="#2de2e6" stroke-width="8"/>
  <rect x="24" y="24" width="912" height="312" fill="none" stroke="#7b2cbf" stroke-width="4"/>

  <!-- pixel stars -->
  <g fill="#f8f7ff">
    <rect x="72" y="52" width="8" height="8"/><rect x="112" y="96" width="4" height="4"/>
    <rect x="208" y="44" width="4" height="4"/><rect x="744" y="56" width="8" height="8"/>
    <rect x="848" y="88" width="4" height="4"/><rect x="892" y="48" width="4" height="4"/>
  </g>
  <g fill="#ff4ecd">
    <rect x="152" y="64" width="8" height="8"/><rect x="696" y="104" width="4" height="4"/>
    <rect x="816" y="40" width="8" height="8"/>
  </g>

  <!-- HUD -->
  <rect x="48" y="40" width="264" height="52" fill="#121a31" stroke="#2de2e6" stroke-width="4"/>
  <text x="64" y="61" fill="#f8f7ff" font-family="monospace" font-size="16" font-weight="700">HP</text>
  <g fill="#ff4e64">
    <path d="M96 52h8v-8h16v8h8v16h-8v8h-8v8h-8v-8h-8v-8h-8V52z"/>
    <path d="M140 52h8v-8h16v8h8v16h-8v8h-8v8h-8v-8h-8v-8h-8V52z"/>
    <path d="M184 52h8v-8h16v8h8v16h-8v8h-8v8h-8v-8h-8v-8h-8V52z"/>
  </g>
  <path d="M228 52h8v-8h16v8h8v16h-8v8h-8v8h-8v-8h-8v-8h-8V52z" fill="#30364d"/>
  <path d="M272 52h8v-8h16v8h8v16h-8v8h-8v8h-8v-8h-8v-8h-8V52z" fill="#30364d"/>

  <rect x="648" y="40" width="264" height="52" fill="#121a31" stroke="#ff4ecd" stroke-width="4"/>
  <text x="664" y="61" fill="#f8f7ff" font-family="monospace" font-size="16" font-weight="700">XP 010/100</text>
  <rect x="664" y="70" width="224" height="10" fill="#30364d"/>
  <rect x="664" y="70" width="24" height="10" fill="#ffd166"/>

  <!-- title panel -->
  <text x="480" y="132" text-anchor="middle" fill="#ffd166" font-family="monospace" font-size="56" font-weight="900" letter-spacing="12">RAMI</text>
  <text x="480" y="162" text-anchor="middle" fill="#2de2e6" font-family="monospace" font-size="18" font-weight="700" letter-spacing="4">PLAYER 01  //  CLASS ???</text>

  <!-- original pixel player -->
  <g transform="translate(120 120)">
    <rect x="32" y="0" width="40" height="8" fill="#1e2238"/>
    <rect x="24" y="8" width="56" height="16" fill="#1e2238"/>
    <rect x="16" y="24" width="72" height="32" fill="#f1b58f"/>
    <rect x="16" y="24" width="16" height="24" fill="#1e2238"/>
    <rect x="72" y="24" width="16" height="24" fill="#1e2238"/>
    <rect x="32" y="32" width="8" height="8" fill="#090d1a"/>
    <rect x="64" y="32" width="8" height="8" fill="#090d1a"/>
    <rect x="40" y="48" width="24" height="8" fill="#d87f76"/>
    <rect x="24" y="56" width="56" height="16" fill="#2de2e6"/>
    <rect x="16" y="72" width="72" height="64" fill="#5146c8"/>
    <rect x="8" y="80" width="16" height="48" fill="#f1b58f"/>
    <rect x="80" y="80" width="16" height="48" fill="#f1b58f"/>
    <rect x="24" y="136" width="24" height="32" fill="#27305b"/>
    <rect x="56" y="136" width="24" height="32" fill="#27305b"/>
    <rect x="16" y="168" width="32" height="16" fill="#ff4ecd"/>
    <rect x="56" y="168" width="32" height="16" fill="#ff4ecd"/>
    <!-- handheld terminal -->
    <rect x="88" y="72" width="48" height="48" fill="#121a31" stroke="#2de2e6" stroke-width="4"/>
    <text x="112" y="105" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="20" font-weight="700">&gt;_</text>
    <rect x="80" y="120" width="64" height="8" fill="#7b2cbf"/>
  </g>

  <!-- developer terminal -->
  <g transform="translate(524 188)">
    <rect x="0" y="0" width="220" height="88" fill="#121a31" stroke="#2de2e6" stroke-width="4"/>
    <rect x="0" y="0" width="220" height="20" fill="#27305b"/>
    <rect x="10" y="7" width="6" height="6" fill="#ff4ecd"/>
    <rect x="24" y="7" width="6" height="6" fill="#ffd166"/>
    <rect x="38" y="7" width="6" height="6" fill="#4ade80"/>
    <rect x="14" y="74" width="148" height="4" fill="#30364d"/>
    <rect x="14" y="74" width="96" height="4" fill="#4ade80"/>
  </g>

  <!-- Taiwan text node at far right -->
  <g transform="translate(780 116)">
    <rect x="0" y="0" width="144" height="180" fill="#052e16" stroke="#22c55e" stroke-width="4"/>
    <rect x="8" y="8" width="128" height="140" fill="#064e3b"/>
    <rect x="20" y="24" width="8" height="8" fill="#4ade80"/>
    <rect x="116" y="24" width="8" height="8" fill="#4ade80"/>
    <rect x="20" y="124" width="8" height="8" fill="#4ade80"/>
    <rect x="116" y="124" width="8" height="8" fill="#4ade80"/>
    <rect x="28" y="27" width="88" height="2" fill="#16a34a"/>
    <rect x="28" y="127" width="88" height="2" fill="#16a34a"/>
    <text x="72" y="58" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11" font-weight="700">ROOTED IN</text>
    <text x="72" y="84" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="22" font-weight="900">TAIWAN</text>
    <text x="72" y="106" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10" font-weight="700">BUILT FOR THE</text>
    <text x="72" y="120" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700">UNKNOWN</text>
    <text x="72" y="164" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">HOME NODE // TW</text>
  </g>

  <!-- non-directional data link -->
  <g transform="translate(276 206)">
    <text x="80" y="12" text-anchor="middle" fill="#2de2e6" font-family="monospace" font-size="10" font-weight="700">DATA LINK</text>
    <rect x="8" y="30" width="144" height="4" fill="#27305b"/>
    <rect x="0" y="24" width="16" height="16" fill="#2de2e6"/>
    <rect x="48" y="24" width="16" height="16" fill="#ff4ecd"/>
    <rect x="96" y="24" width="16" height="16" fill="#ffd166"/>
    <rect x="144" y="24" width="16" height="16" fill="#4ade80"/>
    <text x="8" y="56" text-anchor="middle" fill="#f8f7ff" font-family="monospace" font-size="8">01</text>
    <text x="56" y="56" text-anchor="middle" fill="#f8f7ff" font-family="monospace" font-size="8">10</text>
    <text x="104" y="56" text-anchor="middle" fill="#f8f7ff" font-family="monospace" font-size="8">11</text>
    <text x="152" y="56" text-anchor="middle" fill="#f8f7ff" font-family="monospace" font-size="8">∞</text>
  </g>

  <!-- ground -->
  <g>
    <rect x="40" y="304" width="880" height="24" fill="#27305b"/>
    <g fill="#5146c8">
      <rect x="40" y="304" width="40" height="8"/><rect x="120" y="304" width="40" height="8"/>
      <rect x="200" y="304" width="40" height="8"/><rect x="280" y="304" width="40" height="8"/>
      <rect x="360" y="304" width="40" height="8"/><rect x="440" y="304" width="40" height="8"/>
      <rect x="520" y="304" width="40" height="8"/><rect x="600" y="304" width="40" height="8"/>
      <rect x="680" y="304" width="40" height="8"/><rect x="760" y="304" width="40" height="8"/>
      <rect x="840" y="304" width="40" height="8"/>
    </g>
  </g>
  <text x="476" y="292" text-anchor="middle" fill="#f8f7ff" font-family="monospace" font-size="16" font-weight="700">&gt; EXPLORING THE UNKNOWN_</text>
</svg>
